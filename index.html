game(){const d=[...(S.temp?[S.temp]:[]),...docs()],last=ld('lastDoc','');if(!S.sel.length&&d.some(x=>x.id==last))S.sel=[last];const chosen=S.sel,b=bank();return`<section class="game-setup"><header class="game-launch-hero"><div class="game-launch-copy"><span class="game-kicker">Chế độ ôn nhanh</span><h3>Game Quiz</h3><p>Biến tài liệu và bộ đề của bạn thành một lượt ôn tập ngắn, trực quan và có điểm số.</p><div class="game-launch-pills"><span>4 đáp án</span><span>Điểm & chuỗi đúng</span><span>Ôn lại câu sai</span></div></div><div class="game-launch-art" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span></div><button class="btn sm w" onclick="go('home')">← Thoát</button></header>${errb()}<div class="game-setup-grid"><div class="game-source-panel"><div class="game-panel-title"><span class="game-panel-icon">✦</span><div><b>Tạo game từ tài liệu</b><span>AI tạo câu hỏi trắc nghiệm 4 đáp án từ nội dung bạn chọn.</span></div></div>${d.length?`<div class="game-doc-list">${d.map(x=>`<label class="game-doc-choice"><input type="checkbox" ${chosen.includes(x.id)?'checked':''} onchange="tgl('${x.id}')"><b>${esc(x.name)}</b><span class="tag">${esc(x.subject||'Chưa có môn')}</span></label>`).join('')}</div>`:`<div class="game-empty"><span class="game-empty-mark">↓</span><b>Chưa có tài liệu để tạo game</b><span>Tải PDF, Word hoặc ảnh; AI sẽ tạo câu hỏi theo nội dung của bạn.</span><button class="btn sm o" onclick="S.afterDocMode='game';go('docs')">+ Tải tài liệu</button></div>`}${d.length?`<div class="row" style="margin-top:12px"><button class="btn sm o" onclick="S.afterDocMode='game';go('docs')">+ Tải thêm tài liệu</button></div>`:''}<div class="game-setting-block"><label>Số câu</label><div class="game-option-group">${[5,10,20,30].map(n=>`<button class="btn sm ${+S.f.n==n?'':'o'}" onclick="S.f.n=${n};V.mk()">${n}</button>`).join('')}</div></div><div class="game-setting-block"><label>Thời gian mỗi câu</label><div class="game-option-group">${[15,30,45,60].map(
