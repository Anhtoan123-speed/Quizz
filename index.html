game(){const d=[...(S.temp?[S.temp]:[]),...docs()],last=ld('lastDoc','');if(!S.sel.length&&d.some(x=>x.id==last))S.sel=[last];const chosen=S.sel,b=bank();return`<section class="game-setup"><header class="game-launch-hero"><div class="game-launch-copy"><span class="game-kicker">Chế độ ôn nhanh</span><h3>Game Quiz</h3><p>Biến tài liệu và bộ đề của bạn thành một lượt ôn tập ngắn, trực quan và có điểm số.</p><div class="game-launch-pills"><span>4 đáp án</span><span>Điểm & chuỗi đúng</span><span>Ôn lại câu sai</span></div></div><div class="game-launch-art" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span></div><button class="btn sm w" onclick="go('home')">← Thoát</button></header>${errb()}<div class="game-setup-grid"><div class="game-source-panel"><div class="game-panel-title"><span class="game-panel-icon">✦</span><div><b>Tạo game từ tài liệu</b><span>AI tạo câu hỏi trắc nghiệm 4 đáp án từ nội dung bạn chọn.</span></div></div>${d.length?`<div class="game-doc-list">${d.map(x=>`<label class="game-doc-choice"><input type="checkbox" ${chosen.includes(x.id)?'checked':''} onchange="tgl('${x.id}')"><b>${esc(x.name)}</b><span class="tag">${esc(x.subject||'Chưa có môn')}</span></label>`).join('')}</div>`:`<div class="game-empty"><span class="game-empty-mark">↓</span><b>Chưa có tài liệu để tạo game</b><span>Tải PDF, Word hoặc ảnh; AI sẽ tạo câu hỏi theo nội dung của bạn.</span><button class="btn sm o" onclick="S.afterDocMode='game';go('docs')">+ Tải tài liệu</button></div>`}${d.length?`<div class="row" style="margin-top:12px"><button class="btn sm o" onclick="S.afterDocMode='game';go('docs')">+ Tải thêm tài liệu</button></div>`:''}<div class="game-setting-block"><label>Số câu</label><div class="game-option-group">${[5,10,20,30].map(n=>`<button class="btn sm ${+S.f.n==n?'':'o'}" onclick="S.f.n=${n};V.mk()">${n}</button>`).join('')}</div></div><div class="game-setting-block"><label>Thời gian mỗi câu</label><div class="game-option-group">${[15,30,45,60].map( async function readF(f,set){const ext=f.name.split('.').pop().toLowerCase();if(!EXT.includes(ext))throw Error('Định dạng .'+ext+' chưa được hỗ trợ. Hãy dùng '+EXT.join(', ')+'.');if(f.size>MAXMB*1048576)throw Error('File quá lớn (tối đa '+MAXMB+' MB).');if(!f.size)throw Error('File trống.');

 if(ext=='pptx'){set('Đang đọc slide...');if(!window.JSZip)await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=()=>ko(Error('Không tải được bộ đọc PPTX. Hãy kiểm tra mạng.'));document.head.append(s)});
  const z=await JSZip.loadAsync(await f.arrayBuffer()),names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);let t='';for(const n of names)t+=[...(await z.files[n].async('string')).matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')).join(' ')+'\n';if(t.trim().length<10)throw Error('Không tìm thấy chữ trong file PPTX.');return t}

P.game=function(){const d=[...(S.temp?[S.temp]:[]),...docs()],b=bank(),last=ld('lastDoc','');if(!S.sel.length&&d.some(x=>x.id===last))S.sel=[last];if(!S.sel.length&&d.length)S.sel=[d[0].id];const tab=S.qvTab||(d.length?'doc':'bank'),his=ld('his',[]).filter(x=>x.game),best=(ld('gameTop',[])[0]||{}).points||0,accuracy=his.length?Math.round(his.reduce((sum,x)=>sum+x.pct,0)/his.length):0;
let body='';if(tab==='doc'){body=`<div class="qv-source"><div><h3>Chọn tài liệu để tạo game</h3><p class="mu">AI sẽ tạo câu trắc nghiệm bốn đáp án từ tài liệu bạn chọn.</p>${d.length?`<div class="qv-docs">${d.map(x=>{const on=S.sel.includes(x.id);return`<button class="qv-doc ${on?'on':''}" onclick="tgl('${x.id}');V.mk()"><i class="qv-check">${on?'✓':''}</i><span><b>${esc(x.name)}</b><small>${esc(x.subject||'Chưa có môn')}${x.tags?' · '+esc(x.tags):''}</small></span></button>`}).join('')}</div><button class="btn sm o" onclick="S.afterDocMode='game';go('docs')">+ Tải thêm tài liệu</button>`:`<div class="qv-empty"><b>Chưa có tài liệu</b>Tải PDF, Word, PowerPoint hoặc ảnh để tạo game.</div><button class="btn sm o" onclick="S.afterDocMode='game';go('docs')">+ Tải tài liệu</button>`}</div><div class="qv-config"><label>Số câu</label>${qvSeg('n',[5,10,20,30])}<label style="margin-top:15px">Thời gian mỗi câu</label>${qvSeg('gtime',[15,30,45,60],'s')}<button class="btn qv-play" id="go" ${d.length?'':'disabled'} onclick="build()">⚡ Tạo game & chơi ngay</button><div id="ld"></div></div></div>`}

return`<div class="qv qv-shell"><section class="qv-hero"><div><span class="qv-kicker">CHẾ ĐỘ ÔN NHANH</span><h1>Game Quiz</h1><p>Chọn nhanh, giữ chuỗi đúng và chinh phục điểm số cao nhất của bạn.</p><div class="qv-hero-stats"><span><b>${best}</b>Kỷ lục điểm</span><span><b>${his.length}</b>Ván đã chơi</span><span><b>${his.length?accuracy+'%':'—'}</b>Chính xác TB</span></div></div><div class="qv-shapes" aria-hidden="true"><i>▲</i><i>◆</i><i>●</i><i>■</i></div></section>${errb()}<div class="qv-tabs"><button class="${tab==='doc'?'on':''}" onclick="S.qvTab='doc';V.mk()">✨ Từ tài liệu</button><button class="${tab==='bank'?'on':''}" onclick="S.qvTab='bank';V.mk()">📚 Bộ đề của tôi</button><button class="${tab==='manual'?'on':''}" onclick="S.qvTab='manual';V.mk()">✍️ Tự nhập</button></div><section class="qv-panel">${body}</section></div>`};
